name: CloudMart CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cloudmart
      GLOBALGLE_API_BASE_URL: https://tudowebs.com/api/v1
      CLOUDMART_DEFAULT_MARKUP_PERCENT: "15"
      CLOUDMART_USD_TO_NGN: "1600"
      CLOUDMART_SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
